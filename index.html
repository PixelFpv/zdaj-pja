<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Pytania, materiały, fiszki i powtórki ze wszystkich przedmiotów PJATK." />
    <meta name="theme-color" content="#1a2140" />
    <title>Zdaj PJA</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        var theme, lang;
        try {
          theme = localStorage.getItem('zdaj-pja.theme');
          lang = localStorage.getItem('zdaj-pja.lang');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (lang === 'en' || lang === 'pl') document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
